<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' http://localhost:8097; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: file: thumbnail:; connect-src 'self' https: http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* wss:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'self' file:;">
  <title>Craft Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    // React DevTools - only in development (when running via Vite dev server)
    // Never on file:// (packaged app) — only Vite dev server.
    if (location.protocol === 'http:' && location.hostname === 'localhost') {
      const s = document.createElement('script');
      s.src = 'http://localhost:8097';
      document.head.appendChild(s);
    }
    // Node Buffer polyfill for packaged renderer (shared code paths expect it).
    if (typeof globalThis.Buffer === 'undefined') {
      globalThis.Buffer = {
        from(data, enc) {
          if (typeof data === 'string') {
            const bytes = new TextEncoder().encode(data);
            const arr = Uint8Array.from(bytes);
            arr.toString = (e) => e === 'base64' ? btoa(String.fromCharCode(...arr)) : new TextDecoder().decode(arr);
            return arr;
          }
          const arr = data instanceof ArrayBuffer ? new Uint8Array(data) : Uint8Array.from(data || []);
          arr.toString = (e) => e === 'base64' ? btoa(String.fromCharCode(...arr)) : new TextDecoder().decode(arr);
          return arr;
        },
        alloc(n) { const a = new Uint8Array(n); a.toString = () => ''; return a; },
        isBuffer(x) { return x instanceof Uint8Array; },
        concat(list) {
          const total = list.reduce((s, x) => s + x.length, 0);
          const out = new Uint8Array(total);
          let o = 0;
          for (const x of list) { out.set(x, o); o += x.length; }
          out.toString = (e) => e === 'base64' ? btoa(String.fromCharCode(...out)) : new TextDecoder().decode(out);
          return out;
        },
      };
    }
    if (typeof globalThis.global === 'undefined') globalThis.global = globalThis;
    if (typeof globalThis.process === 'undefined') globalThis.process = { env: {}, browser: true };
  </script>
  <div id="root">
    <!-- Initial loading state: visible until React mounts and replaces #root contents.
         Prevents blank screen on cold start / post-update launch when code cache is stale. -->
    <style>
      #_loader { display:flex; align-items:center; justify-content:center; height:100vh; opacity:0; animation:_fade 0.4s 0.3s forwards; }
      #_loader svg { width:24px; height:24px; animation:_spin 1s linear infinite; }
      @keyframes _fade { to { opacity:1 } }
      @keyframes _spin { to { transform:rotate(360deg) } }
      @media (prefers-color-scheme:dark) { #_loader svg { color:rgba(255,255,255,0.4) } }
      @media (prefers-color-scheme:light) { #_loader svg { color:rgba(0,0,0,0.3) } }
    </style>
    <div id="_loader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke-linecap="round"/></svg></div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
