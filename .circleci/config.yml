version: 2.1

# Toolchain Download Manager — smoke первого запуска (спек:
# docs/superpowers/specs/2026-08-06-toolchain-download-manager-design.md).
# Fresh-profile ensureAll: скачать+проверить sha256 все 11 инструментов,
# установить, запустить omp-лончер и python из toolchain.
#
# Почему CircleCI: GitHub-hosted runners орг. заблокированы биллингом
# (эквивалент на GitHub: .github/workflows/toolchain-smoke.yml — там
# работает только self-hosted linux нога).

commands:
  smoke-steps:
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Toolchain unit tests
          command: bun test packages/shared/src/toolchain
      - run:
          name: Fresh-profile ensureAll + launcher check
          command: |
            SMOKE_DIR="$(mktemp -d /tmp/tc-ci.XXXXXX)"
            CRAFT_CONFIG_DIR="$SMOKE_DIR" bun scripts/toolchain-smoke.ts

jobs:
  toolchain-smoke-linux:
    docker:
      - image: oven/bun:1.3.14-debian
    steps:
      - smoke-steps

  toolchain-smoke-macos:
    macos:
      xcode: "16.2.0"
    resource_class: macos.m1.medium.gen2
    steps:
      - checkout
      - run:
          name: Install Bun (macOS)
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Toolchain unit tests
          command: bun test packages/shared/src/toolchain
      - run:
          name: Fresh-profile ensureAll + launcher check
          command: |
            SMOKE_DIR="$(mktemp -d /tmp/tc-ci.XXXXXX)"
            CRAFT_CONFIG_DIR="$SMOKE_DIR" bun scripts/toolchain-smoke.ts

workflows:
  toolchain-smoke:
    jobs:
      - toolchain-smoke-linux
      - toolchain-smoke-macos
    # фильтр веток: только main/PR, path-фильтр CircleCI не поддерживает
