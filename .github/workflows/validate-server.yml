name: Validate Server (Integration)

on:
  pull_request:
    paths:
      - packages/server/**
      - packages/server-core/**
      - .github/workflows/validate-server.yml
  push:
    paths:
      - packages/server/**
      - packages/server-core/**
      - .github/workflows/validate-server.yml
  workflow_dispatch:

concurrency:
  group: validate-server-${{ github.ref }}

jobs:
  lifecycle:
    # GitHub-hosted not provisioned; linux runner disk-quota blocks bun install — use macOS self-hosted.
    runs-on: [self-hosted, macos-toolchain]
    timeout-minutes: 45
    strategy:
      matrix:
        scenario: [lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kilocode LSP decode smoke (no fork server)
        run: bun test apps/electron/tests/kilocode-lsp-transport.test.ts
        env:
          KILOCODE_LSP_TEST: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      # Fork-server integration leg needs a live Claude auth token as of 2025-05;
      # stdio fork server auth-later path relies on @anthropic-ai/claude-call-proxy or similar helper internal for now
      - name: Build server bundle
        run: bun build packages/server/src/index.ts --target bun --outdir dist-server

      - name: Start server and run lifecycle smoke
        run: |
          # placeholder for real smoke test entry: reuse shared smoke infra if present, otherwise skip
          echo "lifecycle smoke for beta path not implemented yet"

      # TODO restore validate-server tests for client-facing ws server smoke (tsx-based with full env)
