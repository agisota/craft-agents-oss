name: CI Validate Alias
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    # GitHub-hosted runners not provisioned on this repo's plan — use self-hosted.
    runs-on: [self-hosted, linux-toolchain]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.10' }
      - run: bun install --frozen-lockfile
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: bun run validate:ci
